# 原神模拟十连设置
default:
  # 每日抽卡数
  count: 1
  # 撤回消息 0-120 秒, 0不撤回
  delMsg: 110
  # 角色池，武器池限制次数分开计算  1-分开 0-不分开
  LimitSeparate: 0

# 白名单：按 QQ 使用独立出金率，未列出的 QQ 走上面的默认配置
# 概率单位 0-10000，10000 为必出；wai 为 UP 不歪概率 0-100，可省略
# 该配置含个人 QQ，只写入运行目录的 config，不提交仓库
whiteList: {}

# 群单独设置
123465:
  count: 10
  # 撤回消息 0-120 秒, 0不撤回
  delMsg: 110
  # 角色池，武器池限制次数分开计算  1-分开 0-不分开
  LimitSeparate: 0
